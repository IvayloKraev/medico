version: "2"
servers:
- engine: "postgresql"
  uri: "postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?${DB_PARAMS}"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type: "github.com/google/uuid.UUID"
sql:
  - name: "medico"
    schema: "./repo/sql/schema"
    queries: "./repo/sql/query"
    engine: "postgresql"
    gen:
      go:
        out: "repo/db"
        package: "db"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_db_tags: true
        emit_exact_table_names: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_methods_with_db_argument: true
        emit_sql_as_comment: true